name: Federal observatory Pages demo
on:
  push:
    branches: [main]
    paths: ['track_2a/web/pages/**', 'track_2a/scripts/build_pages.py', 'track_2a/src/uzh_rsd/**', 'track_2a/tests/*pages*', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: federal-observatory-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test and build authored-only website
        env:
          PYTHONPATH: track_2a/src
        run: |
          python3 -m unittest discover -s track_2a/tests -p test_pages_build.py
          python3 track_2a/scripts/build_pages.py --out _site
          node track_2a/tests/pages_demo_test.cjs _site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy authored demonstration
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
