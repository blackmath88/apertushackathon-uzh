'use strict';const token='__SESSION_TOKEN__',$=s=>document.querySelector(s),el=(t,text,cls)=>{const n=document.createElement(t);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};let state={campaigns:[]},active=null,tab='Overview',pair=null;
async function api(path,data){const r=await fetch(path,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-Campaign-Token':token},body:JSON.stringify(data)});const v=await r.json();if(!r.ok)throw Error(v.error||'Request failed');return v}
async function action(fn){$('#error').hidden=true;try{await fn()}catch(e){$('#error').hidden=false;$('#error').textContent=e.message}}
function button(text,fn,primary=false){const b=el('button',text,primary?'primary':'');b.onclick=()=>action(fn);return b}
function campaign(){return state.campaigns.find(c=>c.id===active)}

async function refresh(draw=true){state=await api('/api/campaigns');$('#runtime').textContent=state.unsettled?'Inference reserved · active or unsettled attempt':state.inference_enabled?'Local inference enabled · endpoint checked at run time':'Local inference disabled · baseline protected';if(draw)render()}
async function post(route,data){await api('/api/campaigns/'+active+'/'+route,data);await refresh()}
function open(c){active=c.id;tab='Overview';pair=null;render()}
function heading(root,title,description){const h=el('div',undefined,'head'),text=el('div');text.append(el('div',active?'Campaign workspace':'Federal portfolio','label'),el('h1',title),el('p',description));h.append(text);root.append(h);return h}
function render(){const root=$('#view');root.replaceChildren();const c=campaign();$('#breadcrumb').textContent=c?'Campaigns / '+c.name:'Control center';if(!c){portfolio(root);return}
const h=heading(root,c.name,'Choose federal websites, run a bounded review and follow the findings back to their sources.');h.append(button('← All campaigns',()=>{active=null;render()}));const nav=el('nav',undefined,'tabs');nav.setAttribute('aria-label','Campaign workflow');for(const t of ['Overview','Scope','Sources','Runs','Findings','Review','Report','Patterns']){const b=button(t,()=>{tab=t;render()});if(tab===t)b.setAttribute('aria-current','page');nav.append(b)}root.append(nav);
if(tab==='Overview'){const stats=el('div',undefined,'stats');for(const [value,label] of [[c.pairs.length,'page pairs'],[c.pairs.filter(p=>p.status==='complete').length,'comparisons available'],[c.pairs.reduce((a,p)=>a+p.bundle.analysis.candidates.length,0),'possible differences'],[c.pairs.filter(reviewed).length,'pairs fully reviewed']]){const s=el('div',undefined,'stat');s.append(el('strong',value),el('span',label));stats.append(s)}root.append(stats);const panel=el('section',undefined,'panel');panel.append(el('h2','Your campaign, from source to decision'));const steps=el('div',undefined,'steps');for(const [title,note] of [['01 · Scope','Choose websites by department and office'],['02 · Runs','Compare selected captured page pairs'],['03 · Findings','Review differences with source evidence'],['04 · Improve','Report and propose the next search']]){const s=el('div',undefined,'step');s.append(el('b',title),el('small',note));steps.append(s)}panel.append(steps);root.append(panel);const next=c.pairs.length?c.pairs.some(p=>p.status==='ready')?'Runs':'Findings':(c.scope?.site_ids.length?'Sources':'Scope');root.append(button('Continue to '+next.toLowerCase()+' →',()=>{tab=next;render()},true));eventlog(root,c)}

if(tab==='Runs'){batchpanel(root,c);const panel=el('section',undefined,'panel');panel.append(el('h2','Comparison runs'),el('p','Each page pair has one explicit attempt. Failed or interrupted work stays visible; it is never silently retried.'));if(!state.inference_enabled)panel.append(el('div','Local inference is disabled. The demo and review workflow work without it. Enable the local runner only after the running benchmark has settled.','alert'));for(const p of c.pairs){const row=pairrow(p);const run=button('Run comparison',async()=>{if(confirm('Run one local Apertus comparison for this page pair?'))await post('run',{pair:p.id})},true);run.disabled=!state.inference_enabled||state.unsettled||p.status!=='ready';row.append(run);panel.append(row)}if(!c.pairs.length)panel.append(el('p','Add page pairs in Sources first.'));root.append(panel);eventlog(root,c)}
if(tab==='Review'){const panel=el('section',undefined,'panel');panel.append(el('h2','Evidence review'));const select=el('select');select.setAttribute('aria-label','Page pair to review');const available=c.pairs.filter(p=>p.status==='complete');if(!available.length){panel.append(el('p','No completed comparisons yet. Open Runs to check what is ready or blocked.'));root.append(panel);return}if(!available.some(p=>p.id===pair))pair=available[0].id;for(const p of available){const o=el('option',p.title+(reviewed(p)?' · Reviewed':''));o.value=p.id;select.append(o)}select.value=pair;select.onchange=()=>{pair=select.value;render()};panel.append(select,el('p','Review the evidence below, then choose “Save review to campaign”. Give each saved decision a name and note. Untouched findings stay unreviewed; “Unsure” remains open.','subtle'));root.append(panel);const frame=el('iframe');frame.title='Page-pair evidence and review';frame.src='/desk/'+c.id+'/'+pair;root.append(frame)}
if(tab==='Report'){const panel=el('section',undefined,'panel');panel.append(el('h2','Campaign report'),el('p','A report includes each source pair, its analysis status and saved human decisions. Unreviewed suggestions remain suggestions.'));const actions=el('div',undefined,'actions');actions.append(button('Download readable report',()=>download(report(c),'text/plain','campaign-report.txt'),true),button('Export campaign JSON',()=>download(JSON.stringify(c,null,2),'application/json','campaign-evidence.json')));panel.append(actions);root.append(panel);findings(root,c);root.append(el('p','Campaign exports contain captured source text. Keep private captures and review identities within your intended audience.','subtle'))}}
function pairrow(p){const row=el('div',undefined,'row');const label=el('div');label.append(el('strong',p.title),el('small',p.bundle.left.locale.toUpperCase()+' ↔ '+p.bundle.right.locale.toUpperCase()+(p.bundle.fixture?' · Authored demonstration · 0 model calls':'')));row.append(label,el('span',reviewed(p)?'Reviewed':p.status,'chip '+(p.status==='running'?'running':'')));return row}

function portfolio(root){const h=heading(root,'Campaigns','One workspace for each federal language review. Return to your sources, runs and decisions at any time.');h.append(button('Open demonstration',async()=>{const c=await api('/api/campaigns',{name:'Federal services · demonstration',demo:true});await refresh(false);open(c)},true));const create=el('form',undefined,'panel');create.append(el('h2','Start a campaign'));const label=el('label','Campaign name');const input=el('input');input.required=true;input.maxLength=120;input.placeholder='e.g. Energy services · October review';label.append(input);create.append(label);const submit=el('button','Create campaign','primary');submit.type='submit';create.append(submit);create.onsubmit=e=>{e.preventDefault();action(async()=>{const c=await api('/api/campaigns',{name:input.value});await refresh(false);open(c)})};root.append(create);root.append(button('Browse federal directory →',()=>{root.replaceChildren();directory(root,null)}));const list=el('section',undefined,'panel');list.append(el('h2','Your campaigns'));if(!state.campaigns.length)list.append(el('p','No campaigns yet. Start with the demonstration or create your own.'));for(const c of [...state.campaigns].reverse()){const row=el('div',undefined,'row'),info=el('div');info.append(el('strong',c.name),el('small',c.pairs.length+' page pairs · updated '+new Date(c.updated_at).toLocaleString()));row.append(info,button('Open campaign →',()=>open(c)));list.append(row)}root.append(list)}
function sources(root,c){const panel=el('section',undefined,'panel');panel.append(el('h2','Source pairs'));for(const p of c.pairs)panel.append(pairrow(p));panel.append(el('div','Import supported: corresponding BFE page captures. Automated discovery is not connected yet; no background crawl is running.','alert'));const form=el('form');const inputs={};function field(key,title,type='text',parent=form){const label=el('label',title),input=el('input');input.type=type;input.required=true;inputs[key]=input;label.append(input);parent.append(label);return input}field('title','Page title');const grid=el('div',undefined,'two');for(const side of ['left','right']){const block=el('div');field(side+'_url',(side==='left'?'First':'Second')+' page URL','url',block);const label=el('label','Language'),select=el('select');for(const [id,name] of [['de','German'],['fr','French'],['it','Italian'],['en','English']]){const option=el('option',name);option.value=id;select.append(option)}select.value=side==='left'?'de':'fr';inputs[side+'_language']=select;label.append(select);block.append(label);field(side+'_html','Saved HTML capture','file',block).accept='.html,.htm';grid.append(block)}form.append(grid);field('captured','Capture date and time','datetime-local');field('pairing','Why do these pages correspond?');field('rights','Permission / licence reference');field('reviewer','Imported by');const permission=field('permission','I have permission to use these captured pages','checkbox');const submit=el('button','Import page pair','primary');submit.type='submit';form.append(submit);form.onsubmit=e=>{e.preventDefault();action(async()=>{submit.disabled=true;try{for(const s of ['left','right'])if(inputs[s+'_html'].files[0].size>1_000_000)throw Error('Each HTML capture must be below 1 MB');const metadata={content_use_permitted:permission.checked,rights_basis:inputs.rights.value,pairing_rationale:inputs.pairing.value,reviewer:inputs.reviewer.value,captured_at_utc:new Date(inputs.captured.value).toISOString()};for(const s of ['left','right'])metadata[s]={url:inputs[s+'_url'].value,language:inputs[s+'_language'].value};await post('pairs',{title:inputs.title.value,left_html:await inputs.left_html.files[0].text(),right_html:await inputs.right_html.files[0].text(),metadata})}finally{submit.disabled=false}})};panel.append(form);root.append(panel)}
function report(c){const lines=['LOST IN SWITZERLAND — CAMPAIGN REPORT',c.name,'Exported: '+new Date().toISOString(),'Catalogue: '+(c.scope?.catalogue_version||'not selected'),'Selected sites: '+(c.scope?.site_ids.join(', ')||'none'),...((c.batches||[]).map(b=>'Batch '+b.id+' | '+b.started_at+' | '+b.status+' | '+b.method)),''];for(const p of c.pairs){lines.push(p.title,p.bundle.fixture?'AUTHORED DEMONSTRATION — NOT GOVERNMENT CONTENT OR MODEL RESULTS':'Captured federal content','Analysis: '+p.status,'Run: '+(p.run_id||'no model run recorded'),'Started: '+(p.started_at||'not applicable'),'Method: '+(p.bundle.analysis.provenance?.method||p.bundle.analysis.method||'not run'),'Bundle: '+p.bundle.digest);for(const s of ['left','right'])lines.push(p.bundle[s].locale+': '+p.bundle[s].source_url,'Captured: '+p.bundle[s].retrieved_at_utc,'HTML hash: '+p.bundle[s].sha256_html,'Source hash: '+p.bundle[s].sha256_extract);for(const f of p.bundle.analysis.candidates){const r=p.review?.reviews.find(r=>r.candidate_id===f.id);lines.push('Finding '+p.id+':'+f.id+' ['+f.kind+']: '+f.left+' / '+f.right,'Review: '+(r?r.state+' · '+r.reviewer+' · '+r.reason:'NOT REVIEWED'))}lines.push('')}for(const x of c.patterns||[])lines.push('Search hypothesis (NOT EVALUATED): '+x.name,'Query: '+x.query,'Rationale: '+x.rationale,'Saved: '+x.created_at);lines.push('Human review is self-declared. No suggestions does not prove equivalence.');return lines.join('\n')}

function discoveryPanel(root,c){const panel=el('section',undefined,'panel');panel.id='discovery';panel.append(el('h2','Page discovery'),el('p','Preview the limits, start discovery explicitly, then choose observed page families. Discovery requests only the sitemap, feed, navigation and seed pages of reviewed sources; everything else stays listed as not visited.'));const names=Object.fromEntries(state.catalogue.sites.map(s=>[s.id,s.name]));if(!c.scope.site_ids.length)panel.append(el('p','Save at least one website in the scope first.'));for(const sid of c.scope.site_ids){const box=el('div',undefined,'directory-row');box.dataset.site=sid;const body=el('div');body.style.flex='1';box.append(body);panel.append(box);drawSite(body,sid)}root.append(panel);
function drawSite(body,sid){body.replaceChildren();body.append(el('strong',names[sid]||sid));const runs=(campaign().discovery_runs||[]).filter(r=>r.site_id===sid),last=runs[runs.length-1],out=el('div');body.append(out);
if(last&&last.state==='running'){body.append(el('div','Discovery running · '+(last.progress.phase||'starting')+' · '+(last.progress.total_attempts||0)+' requests made · '+(last.progress.candidates||0)+' candidates seen','alert running'));setTimeout(async()=>{await refresh(false);const root2=document.querySelector('[data-site="'+sid+'"] > div');if(root2)drawSite(root2,sid)},700);return}

actions.append(button('Preview limits',async()=>{const v=await api('/api/campaigns/'+c.id+'/discovery-preview',{site_id:sid});preview.replaceChildren();if(!v.eligible){preview.append(el('div','Cannot start: '+v.reason+'. '+v.detail,'alert'));return}
const b=v.budgets;preview.append(el('div','Profile '+v.profile+' · hosts '+v.hosts.join(', ')+' · up to '+b.max_total_attempts+' requests ('+b.max_page_attempts+' pages), '+Math.round(b.max_body_bytes/1048576)+' MiB, '+b.max_wall_seconds+' s, at least '+v.min_delay_seconds+' s between requests. Sources: '+v.sources.join('; ')+'. '+v.notes.join(' '),'alert'));preview.append(button('Start discovery now',async()=>{await api('/api/campaigns/'+c.id+'/discovery-start',{site_id:sid,confirm:true});await refresh(false);drawSite(body,sid)},true))}));body.append(actions,preview)}
function results(body,sid,run){const sel=new Set((campaign().scope.page_families||[]).filter(f=>f.snapshot_id===run.snapshot_id).map(f=>f.family_id)),wrap=el('div');body.append(el('p','Snapshot '+new Date(run.plan?run.started_at:run.started_at).toLocaleString()+' · stopped: '+(run.stop_reason||'completed')+' · '+run.summary.families+' families, '+run.summary.candidates+' candidates, '+run.summary.unvisited+' not visited.'),wrap);api('/api/campaigns/'+campaign().id+'/snapshots/'+run.snapshot_id).then(snap=>{const states={};snap.candidates.forEach(x=>states[x.state]=(states[x.state]||0)+1);wrap.append(el('p','Candidate states: '+Object.entries(states).map(([k,v])=>k+' '+v).join(' · ')+'. Not observed means no source declared it, not that it does not exist.','subtle'));for(const f of snap.families){const row=el('div',undefined,'directory-row'),box=el('input'),label=el('label');box.type='checkbox';box.id='fam-'+f.family_id;box.checked=sel.has(f.family_id);box.onchange=()=>{box.checked?sel.add(f.family_id):sel.delete(f.family_id)};label.htmlFor=box.id;const first=Object.values(f.languages).flat()[0]||f.unknown_language[0];label.append(el('strong',first?new URL(first.url).pathname:f.family_id),el('small',['de','fr','it','en'].map(l=>l.toUpperCase()+': '+f.language_availability[l]).join(' · ')+' · '+f.status.replace('_',' ')));for(const x of f.contradictions)label.append(el('small','Contradiction: '+x.detail));row.append(box,label);wrap.append(row)}wrap.append(button('Save page-family scope',async()=>{await api('/api/campaigns/'+campaign().id+'/page-scope',{families:[...sel].map(id=>({snapshot_id:run.snapshot_id,family_id:id}))});await refresh(false);body.replaceChildren();drawSite(body,sid);body.append(el('p','Saved '+sel.size+' page families. No capture started.','subtle'))},true))}).catch(e=>wrap.append(el('div',e.message,'error')))}}
function preparationPanel(root,c){const panel=el('section',undefined,'panel');panel.id='preparation';panel.append(el('h2','Capture preparation'),el('p','Saved page families become evidence only after a reviewer certifies the pair. Live originals may have changed since capture; captured evidence is the hashed copy a review is based on.'));const mode=state.capture_mode||{},fams=c.scope.page_families||[];if(!fams.length){panel.append(el('p','No page families saved yet. Select families under Page discovery first.'));root.append(panel);return}
const list=el('div');panel.append(list);root.append(panel);
api('/api/campaigns/'+c.id+'/preparation').then(v=>{for(const f of v.families){const row=el('div',undefined,'directory-row'),body=el('div');body.style.flex='1';row.dataset.family=f.family_id;row.append(body);body.append(el('strong','Family '+f.family_id+' · '+f.site_id),el('small','Pairing '+f.status.replace('_',' ')+' · '+['de','fr','it','en'].map(l=>l.toUpperCase()+': '+f.language_availability[l]).join(' · ')));

if(f.capture_status==='captured'){body.append(el('small','Captured as a ready page pair; review it under Review.'))}
else if(!mode.fixture&&!mode.transport){body.append(el('div','Capture unavailable: no authorised transport is connected. Nothing was requested.','alert'))}
else{const form=el('div'),inputs={};for(const [id,t] of [['reviewer','Reviewer'],['pairing_rationale','Pairing rationale'],['rights_basis','Rights basis']]){const l=el('label',t),i=el('input');i.maxLength=500;l.append(i);form.append(l);inputs[id]=i}
const sel={};for(const [id,t,d] of [['left_language','Left language','de'],['right_language','Right language','fr']]){const l=el('label',t),s=el('select');for(const k of ['de','fr','it','en']){const o=el('option',k.toUpperCase());o.value=k;s.append(o)}s.value=d;l.append(s);form.append(l);sel[id]=s}
const cl=el('label'),cb=el('input');cb.type='checkbox';cb.id='certify-'+f.family_id;cl.htmlFor=cb.id;cl.append(cb,document.createTextNode(' I certify this pair as a reviewer assertion (not verified equivalence)'));form.append(cl);
form.append(button(mode.fixture?'Capture fixture evidence':'Capture evidence',async()=>{await api('/api/campaigns/'+c.id+'/capture',{snapshot_id:f.snapshot_id,family_id:f.family_id,pairing:{reviewer:inputs.reviewer.value,pairing_rationale:inputs.pairing_rationale.value,rights_basis:inputs.rights_basis.value,left_language:sel.left_language.value,right_language:sel.right_language.value,certified:cb.checked,content_use_permitted:false}}).then(async r=>{await refresh();if(r.status!=='captured')throw Error('Capture '+r.status.replace('_',' ')+': '+r.blockers.join(', '))})},true));body.append(form)}
list.append(row)}}).catch(e=>list.append(el('div',e.message,'error')))}
function directory(root,c){const cat=state.catalogue,selected=new Set(c?.scope?.site_ids||[]);heading(root,c?'Campaign scope':'Federal website directory','Browse the administrative structure, then select the websites your campaign should cover.');root.append(el('div',cat.sites.length+' indexed website entries · checked 14 October 2026 · selected executive bodies only. Listed does not mean crawled or analysed.','alert'));root.append(link('Official organisation directory ↗',cat.source_url));const filter=el('input');filter.placeholder='Find an office, department or domain';filter.setAttribute('aria-label','Filter federal directory');root.append(filter);const listing=el('div');root.append(listing);const count=el('p');root.append(count);
function draw(){listing.replaceChildren();count.textContent=selected.size+' websites selected';const q=filter.value.toLowerCase();for(const dept of cat.sites.filter(s=>!s.parent)){const children=cat.sites.filter(s=>s.id===dept.id||s.parent===dept.id),matches=children.filter(s=>(s.name+' '+s.host+' '+dept.name).toLowerCase().includes(q));if(!matches.length)continue;const group=el('details',undefined,'panel');group.open=!!q||children.some(s=>selected.has(s.id));group.append(el('summary',dept.name+' · '+children.length+' entries'));const all=button('Select all '+children.length+' listed sites',()=>{children.forEach(s=>selected.add(s.id));draw()});group.append(all);for(const site of matches){const row=el('div',undefined,'directory-row'),box=el('input'),label=el('label');box.type='checkbox';box.id='site-'+site.id;box.checked=selected.has(site.id);box.onchange=()=>{box.checked?selected.add(site.id):selected.delete(site.id);count.textContent=selected.size+' websites selected'};label.htmlFor=box.id;label.append(el('strong',site.name),el('small',site.host+' · Listed; page discovery pending'),el('small',site.capture_supported?'Permitted HTML imports supported':'Capture adapter not connected'));row.append(box,label,link('Website ↗',site.url));group.append(row)}listing.append(group)}}filter.oninput=draw;draw();if(c)root.append(button('Save campaign scope',async()=>post('scope',{site_ids:[...selected]}),true));else{const label=el('label','Campaign name'),name=el('input');name.maxLength=120;name.placeholder='e.g. Federal services · October';label.append(name);root.append(label,button('Create campaign from selection',async()=>{if(!selected.size)throw Error('Select at least one website');const made=await api('/api/campaigns',{name:name.value,site_ids:[...selected]});await refresh(false);open(made)},true))}root.append(el('p','Selection records scope only. It does not start a crawl or grant content-use permission. A department selection includes only the entries shown here, not all agencies.','subtle'))}
function batchpanel(root,c){const panel=el('section',undefined,'panel');panel.append(el('h2','Run a selected batch'),el('p','Choose captured page pairs. One request runs at a time; the batch stops on failure or uncertain delivery. Each batch pins its scope, captures and detector method.'));const ids=new Set(),ready=c.pairs.filter(p=>p.status==='ready');for(const p of ready){const label=el('label'),check=el('input');check.type='checkbox';check.onchange=()=>{check.checked?ids.add(p.id):ids.delete(p.id)};label.append(check,document.createTextNode(' '+p.title));panel.append(label)}const run=button('Start selected batch',async()=>{if(!ids.size)throw Error('Select at least one ready page pair');if(confirm('Start up to '+ids.size+' local comparisons, sequentially?'))await post('batch',{pairs:[...ids]})},true);run.disabled=!state.inference_enabled||state.unsettled||!ready.length;panel.append(run);if(!ready.length)panel.append(el('p','No ready captures. Selected websites still need paired page captures in Sources.'));for(const b of [...(c.batches||[])].reverse()){const row=el('div',undefined,'row'),info=el('div');info.append(el('strong',new Date(b.started_at).toLocaleString()+' · '+b.status),el('small',b.completed_pair_ids.length+'/'+b.pair_ids.length+' attempts recorded · '+b.method),el('small','Run '+b.id));row.append(info);panel.append(row)}root.append(panel)}
function findings(root,c){const panel=el('section',undefined,'panel');panel.append(el('h2','Findings register'),el('p','A finding starts as a suggestion. Human decisions and original-source evidence stay attached. Absence of findings does not prove equivalence.'));const select=el('select');select.setAttribute('aria-label','Finding status');for(const [value,label]of [['all','All findings'],['confirmed','Confirmed differences'],['unreviewed','Awaiting review'],['unresolved','Unresolved'],['rejected','Equivalent / rejected']]){const o=el('option',label);o.value=value;select.append(o)}panel.append(select);root.append(panel);const list=el('div');root.append(list);function draw(){list.replaceChildren();let n=0;for(const p of c.pairs)for(const f of p.bundle.analysis.candidates){const r=p.review?.reviews.find(r=>r.candidate_id===f.id),status=r?.state||'unreviewed';if(select.value!=='all'&&select.value!==status)continue;n++;const card=el('article',undefined,'panel finding');card.dataset.state=status;card.append(el('span',status==='confirmed'?'Human-confirmed':status,'chip'),el('h2',f.kind==='CHANGE'?(status==='confirmed'?'Confirmed meaning difference':'Possible meaning difference between versions'):f.kind==='LEFT_ONLY'?'Content may be missing from the second version':'Content may be missing from the first version'),el('p',p.title));const office=state.catalogue.sites.find(s=>s.host===new URL(p.bundle.left.source_url).hostname);if(office)card.append(el('p',(state.catalogue.sites.find(s=>s.id===office.parent)?.name||office.name)+' / '+office.name,'subtle'));if(p.bundle.fixture)card.append(el('div','Authored demonstration — not a government discrepancy or model result','alert'));card.append(el('blockquote',(f.left||'[No matching excerpt supplied]')+' ↔ '+(f.right||'[No matching excerpt supplied]')));if(r)card.append(el('p',r.reason+' — '+r.reviewer));const details=el('details',undefined,'evidence');details.append(el('summary','Provenance & original sources'));for(const side of ['left','right']){const d=p.bundle[side];details.append(link(d.locale.toUpperCase()+' original ↗',d.source_url),el('p','Captured '+d.retrieved_at_utc+' · HTML SHA-256 '+d.sha256_html,'subtle'))}details.append(el('p','Finding '+p.id+':'+f.id+' · Bundle '+p.bundle.digest,'subtle'),el('p','Run '+(p.run_id||'not a model run')+' · '+(p.started_at||'no run timestamp')+' · '+(p.bundle.analysis.provenance?.method||p.bundle.analysis.method||'unknown method'),'subtle'));card.append(details,button('Inspect evidence & review',()=>{pair=p.id;tab='Review';render()}));list.append(card)}if(!n)list.append(el('p','No findings in this view. Check Runs for unanalysed, failed or interrupted pairs.'))}select.onchange=draw;draw()}
function patterns(root,c){const panel=el('section',undefined,'panel');panel.append(el('h2','Learn from reviewed findings'),el('p','Save a search hypothesis backed by this campaign’s confirmed differences and rejected suggestions. It remains a proposal until tested on separate development examples; it does not change the detector or launch a search.'));const form=el('form'),fields={};for(const [id,title] of [['name','Pattern name'],['query','Search terms / proposed query'],['rationale','Why should this help?'],['author','Proposed by']]){const label=el('label',title),input=el('input');input.required=true;input.maxLength=1000;label.append(input);form.append(label);fields[id]=input}const submit=el('button','Save search hypothesis','primary');submit.type='submit';form.append(submit);form.onsubmit=e=>{e.preventDefault();action(()=>post('pattern',Object.fromEntries(Object.entries(fields).map(([k,v])=>[k,v.value]))))};panel.append(form);root.append(panel);for(const x of [...(c.patterns||[])].reverse()){const card=el('section',undefined,'panel');card.append(el('span','Proposed · not evaluated','chip'),el('h2',x.name),el('p',x.query),el('p',x.rationale),el('small',x.created_at+' · '+x.author+' · '+x.examples.length+' review snapshots · version '+x.version));if(x.examples.some(e=>e.fixture))card.append(el('p','Includes authored demonstration evidence; not evidence of live effectiveness.'));root.append(card)}}

$('#directory').onclick=()=>{active=null;$('#breadcrumb').textContent='Federal directory';$('#view').replaceChildren();directory($('#view'),null)};
$('#campaigns').onclick=()=>{active=null;render()};$('#capabilities').onclick=()=>{$('#view').replaceChildren(el('h1','Capabilities'),el('p','Available: sourced federal website directory, saved campaign scopes, BFE capture imports, dated sequential batches, findings reports, evidence review and versioned search hypotheses.'),el('div','Not connected: automatic page discovery, capture beyond BFE, scheduled monitoring, recurrence matching, automatic pattern evaluation, remote workers and multi-user authentication.','alert'));active=null};
addEventListener('message',e=>{const frame=$('iframe');if(e.origin!==location.origin||e.source!==frame?.contentWindow||e.data?.type!=='federal-review'||e.data.campaign!==active||e.data.pair!==pair)return;action(async()=>{try{await api('/api/campaigns/'+active+'/review',{pair,draft:e.data.draft});await refresh(false);frame.contentWindow.postMessage({type:'review-result',message:'Review saved to this campaign.'},location.origin)}catch(err){frame.contentWindow.postMessage({type:'review-result',message:err.message},location.origin);throw err}})});
action(()=>refresh());setInterval(()=>{if(campaign()?.pairs.some(p=>p.status==='running')||campaign()?.batches?.some(b=>b.status==='running'))action(()=>refresh(tab==='Runs'||tab==='Overview'))},2500);
