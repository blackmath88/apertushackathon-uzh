<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lost in Switzerland · Campaign center</title><style>
:root{--ink:#213830;--muted:#68766e;--line:#dce2dc;--green:#24523f}*{box-sizing:border-box}body{margin:0;background:#f6f7f4;color:var(--ink);font:15px/1.5 system-ui}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;border-radius:6px;color:var(--ink);padding:10px 15px;font-weight:600}button:hover{background:#eaf0e9}button:disabled{cursor:not-allowed;opacity:.5}.primary{background:var(--green);color:white}.primary:hover{background:#183c2d}a{color:inherit}button,input,select,a{outline-offset:4px}aside{position:fixed;inset:0 auto 0 0;width:225px;background:#eef1eb;border-right:1px solid var(--line);padding:28px 18px;display:flex;flex-direction:column}.brand{font-size:19px;font-weight:750;letter-spacing:-.04em;margin-bottom:40px}.brand small{display:block;color:var(--muted);font-size:12px;font-weight:500;letter-spacing:0}.label{color:var(--muted);text-transform:uppercase;font-size:10px;letter-spacing:.12em;font-weight:700}.nav{border:0;background:transparent;text-align:left;margin:5px 0}.nav.active{background:#dce7db}.runtime{margin-top:auto;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:18px}main{margin-left:225px}.toolbar{height:69px;border-bottom:1px solid var(--line);padding:0 34px;display:flex;align-items:center;justify-content:space-between;background:white}.chip{font-size:12px;border:1px solid var(--line);padding:4px 9px;border-radius:20px;display:inline-block}.content{max-width:1500px;padding:35px;margin:auto}h1{font-size:36px;line-height:1.2;letter-spacing:-.045em;margin:8px 0}h2{font-size:21px;letter-spacing:-.025em;margin:0 0 10px}p{color:var(--muted)}.head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.panel{background:white;border:1px solid var(--line);border-radius:9px;padding:24px;margin:18px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat{padding:20px;background:white;border:1px solid var(--line);border-radius:8px}.stat strong{display:block;font-size:30px}.stat span{font-size:12px;color:var(--muted)}.row{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:18px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row small{display:block;color:var(--muted)}.tabs{display:flex;gap:6px;overflow:auto;border-bottom:1px solid var(--line);padding-bottom:12px}.tabs button{border:0;background:transparent;white-space:nowrap}.tabs button[aria-current=page]{background:#e1ebdf}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.step{border-left:3px solid #cbd7c9;padding:10px 14px}.step b,.step small{display:block}.step small{color:var(--muted);font-size:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;margin:12px 0;font-size:13px}input:not([type=checkbox]),select{display:block;width:100%;margin-top:6px;padding:10px;border:1px solid #bbc8bd;border-radius:5px;background:white;color:var(--ink)}.alert{background:#fbefd7;border-left:3px solid #a87823;padding:12px 16px;font-size:13px;margin:18px 0}.events{font:12px/1.8 ui-monospace,monospace;background:#18352d;color:#d7e8dc;padding:20px;border-radius:7px;max-height:360px;overflow:auto}.events div{margin:5px 0}.events time{color:#92b59f;margin-right:15px}iframe{width:100%;height:850px;border:1px solid var(--line);border-radius:8px;background:white}.actions{display:flex;gap:9px;flex-wrap:wrap}.empty{padding:35px;text-align:center}.error{background:#fff1eb;padding:14px;border:1px solid #a74434;color:#823425;margin-bottom:15px}.subtle{font-size:12px;color:var(--muted)}[hidden]{display:none!important}@media(max-width:850px){aside{position:static;width:auto;padding:16px;display:block;border-bottom:1px solid var(--line)}.brand{margin:0 0 10px}.label,.runtime{display:none}.nav{display:inline-block}main{margin:0}.toolbar{padding:0 20px}.content{padding:20px}.stats,.steps{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.head{align-items:start;flex-direction:column}.row{align-items:start;flex-wrap:wrap}h1{font-size:30px}iframe{height:1000px}}@media(prefers-reduced-motion:no-preference){.running{animation:pulse 1.5s infinite}@keyframes pulse{50%{opacity:.5}}}
</style></head><body><aside><div class="brand">Lost in Switzerland<small>Federal campaign center</small></div><div class="label">Workspace</div><button class="nav active" id="campaigns">▦ &nbsp; Campaigns</button><button class="nav" id="capabilities">◉ &nbsp; Capabilities</button><div class="runtime" id="runtime">Local workspace</div></aside><main><header class="toolbar"><strong id="breadcrumb">Control center</strong><span class="chip">Local · private workspace</span></header><div class="content"><div id="error" class="error" role="alert" hidden></div><div id="view"></div></div></main><script>
'use strict';const token='__SESSION_TOKEN__',$=s=>document.querySelector(s),el=(t,text,cls)=>{const n=document.createElement(t);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};let state={campaigns:[]},active=null,tab='Overview',pair=null;
async function api(path,data){const r=await fetch(path,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-Campaign-Token':token},body:JSON.stringify(data)});const v=await r.json();if(!r.ok)throw Error(v.error||'Request failed');return v}
async function action(fn){$('#error').hidden=true;try{await fn()}catch(e){$('#error').hidden=false;$('#error').textContent=e.message}}
function button(text,fn,primary=false){const b=el('button',text,primary?'primary':'');b.onclick=()=>action(fn);return b}
function campaign(){return state.campaigns.find(c=>c.id===active)}
function reviewed(p){return p.review?.reviews.length===p.bundle.analysis.candidates.length&&p.bundle.analysis.status==='complete'&&p.bundle.analysis.candidates.length>0&&p.review.reviews.every(r=>r.state!=='unresolved')}
async function refresh(draw=true){state=await api('/api/campaigns');$('#runtime').textContent=state.unsettled?'Inference reserved · active or unsettled attempt':state.inference_enabled?'Local inference enabled · endpoint checked at run time':'Local inference disabled · baseline protected';if(draw)render()}
async function post(route,data){await api('/api/campaigns/'+active+'/'+route,data);await refresh()}
function open(c){active=c.id;tab='Overview';pair=null;render()}
function heading(root,title,description){const h=el('div',undefined,'head'),text=el('div');text.append(el('div',active?'Campaign workspace':'Federal portfolio','label'),el('h1',title),el('p',description));h.append(text);root.append(h);return h}
function render(){const root=$('#view');root.replaceChildren();const c=campaign();$('#breadcrumb').textContent=c?'Campaigns / '+c.name:'Control center';if(!c){portfolio(root);return}
const h=heading(root,c.name,'Collect page pairs, compare meaning, review the evidence and take a report away.');h.append(button('← All campaigns',()=>{active=null;render()}));const nav=el('nav',undefined,'tabs');nav.setAttribute('aria-label','Campaign workflow');for(const t of ['Overview','Sources','Runs','Review','Report']){const b=button(t,()=>{tab=t;render()});if(tab===t)b.setAttribute('aria-current','page');nav.append(b)}root.append(nav);
if(tab==='Overview'){const stats=el('div',undefined,'stats');for(const [value,label] of [[c.pairs.length,'page pairs'],[c.pairs.filter(p=>p.status==='complete').length,'comparisons available'],[c.pairs.reduce((a,p)=>a+p.bundle.analysis.candidates.length,0),'possible differences'],[c.pairs.filter(reviewed).length,'pairs fully reviewed']]){const s=el('div',undefined,'stat');s.append(el('strong',value),el('span',label));stats.append(s)}root.append(stats);const panel=el('section',undefined,'panel');panel.append(el('h2','Your campaign, from source to decision'));const steps=el('div',undefined,'steps');for(const [title,note] of [['01 · Sources','Import corresponding language pages'],['02 · Compare','One bounded local Apertus attempt'],['03 · Review','Inspect and save your decisions'],['04 · Report','Export evidence and unfinished work']]){const s=el('div',undefined,'step');s.append(el('b',title),el('small',note));steps.append(s)}panel.append(steps);root.append(panel);const next=c.pairs.length?c.pairs.some(p=>p.status==='ready')?'Runs':'Review':'Sources';root.append(button('Continue to '+next.toLowerCase()+' →',()=>{tab=next;render()},true));eventlog(root,c)}
if(tab==='Sources')sources(root,c);
if(tab==='Runs'){const panel=el('section',undefined,'panel');panel.append(el('h2','Comparison runs'),el('p','Each page pair has one explicit attempt. Failed or interrupted work stays visible; it is never silently retried.'));if(!state.inference_enabled)panel.append(el('div','Local inference is disabled. The demo and review workflow work without it. Enable the local runner only after the running benchmark has settled.','alert'));for(const p of c.pairs){const row=pairrow(p);const run=button('Run comparison',async()=>{if(confirm('Run one local Apertus comparison for this page pair?'))await post('run',{pair:p.id})},true);run.disabled=!state.inference_enabled||state.unsettled||p.status!=='ready';row.append(run);panel.append(row)}if(!c.pairs.length)panel.append(el('p','Add page pairs in Sources first.'));root.append(panel);eventlog(root,c)}
if(tab==='Review'){const panel=el('section',undefined,'panel');panel.append(el('h2','Evidence review'));const select=el('select');select.setAttribute('aria-label','Page pair to review');const available=c.pairs.filter(p=>p.status==='complete');if(!available.length){panel.append(el('p','No completed comparisons yet. Open Runs to check what is ready or blocked.'));root.append(panel);return}if(!available.some(p=>p.id===pair))pair=available[0].id;for(const p of available){const o=el('option',p.title+(reviewed(p)?' · Reviewed':''));o.value=p.id;select.append(o)}select.value=pair;select.onchange=()=>{pair=select.value;render()};panel.append(select,el('p','Review the evidence below, then choose “Save review to campaign”. Give every decision a name and note; “Unsure” remains open.','subtle'));root.append(panel);const frame=el('iframe');frame.title='Page-pair evidence and review';frame.src='/desk/'+c.id+'/'+pair;root.append(frame)}
if(tab==='Report'){const panel=el('section',undefined,'panel');panel.append(el('h2','Campaign report'),el('p','A report includes each source pair, its analysis status and saved human decisions. Unreviewed suggestions remain suggestions.'));const actions=el('div',undefined,'actions');actions.append(button('Download readable report',()=>download(report(c),'text/plain','campaign-report.txt'),true),button('Export campaign JSON',()=>download(JSON.stringify(c,null,2),'application/json','campaign-evidence.json')));panel.append(actions);root.append(panel);for(const p of c.pairs)root.append(pairrow(p));root.append(el('p','Campaign exports contain captured source text. Keep private captures and review identities within your intended audience.','subtle'))}}
function pairrow(p){const row=el('div',undefined,'row');const label=el('div');label.append(el('strong',p.title),el('small',p.bundle.left.locale.toUpperCase()+' ↔ '+p.bundle.right.locale.toUpperCase()+(p.bundle.fixture?' · Authored demonstration · 0 model calls':'')));row.append(label,el('span',reviewed(p)?'Reviewed':p.status,'chip '+(p.status==='running'?'running':'')));return row}
function eventlog(root,c){const panel=el('section',undefined,'panel');panel.append(el('h2','Activity'));const log=el('div',undefined,'events');for(const e of c.events.slice(-30).reverse()){const line=el('div');line.append(el('time',new Date(e.at).toLocaleTimeString()),document.createTextNode(e.message));log.append(line)}panel.append(log);root.append(panel)}
function portfolio(root){const h=heading(root,'Campaigns','One workspace for each federal language review. Return to your sources, runs and decisions at any time.');h.append(button('Open demonstration',async()=>{const c=await api('/api/campaigns',{name:'Federal services · demonstration',demo:true});await refresh(false);open(c)},true));const create=el('form',undefined,'panel');create.append(el('h2','Start a campaign'));const label=el('label','Campaign name');const input=el('input');input.required=true;input.maxLength=120;input.placeholder='e.g. Energy services · October review';label.append(input);create.append(label);const submit=el('button','Create campaign','primary');submit.type='submit';create.append(submit);create.onsubmit=e=>{e.preventDefault();action(async()=>{const c=await api('/api/campaigns',{name:input.value});await refresh(false);open(c)})};root.append(create);const list=el('section',undefined,'panel');list.append(el('h2','Your campaigns'));if(!state.campaigns.length)list.append(el('p','No campaigns yet. Start with the demonstration or create your own.'));for(const c of [...state.campaigns].reverse()){const row=el('div',undefined,'row'),info=el('div');info.append(el('strong',c.name),el('small',c.pairs.length+' page pairs · updated '+new Date(c.updated_at).toLocaleString()));row.append(info,button('Open campaign →',()=>open(c)));list.append(row)}root.append(list)}
function sources(root,c){const panel=el('section',undefined,'panel');panel.append(el('h2','Source pairs'));for(const p of c.pairs)panel.append(pairrow(p));panel.append(el('div','Import supported: corresponding BFE page captures. Automated discovery is not connected yet; no background crawl is running.','alert'));const form=el('form');const inputs={};function field(key,title,type='text',parent=form){const label=el('label',title),input=el('input');input.type=type;input.required=true;inputs[key]=input;label.append(input);parent.append(label);return input}field('title','Page title');const grid=el('div',undefined,'two');for(const side of ['left','right']){const block=el('div');field(side+'_url',(side==='left'?'First':'Second')+' page URL','url',block);const label=el('label','Language'),select=el('select');for(const [id,name] of [['de','German'],['fr','French'],['it','Italian'],['en','English']]){const option=el('option',name);option.value=id;select.append(option)}select.value=side==='left'?'de':'fr';inputs[side+'_language']=select;label.append(select);block.append(label);field(side+'_html','Saved HTML capture','file',block).accept='.html,.htm';grid.append(block)}form.append(grid);field('captured','Capture date and time','datetime-local');field('pairing','Why do these pages correspond?');field('rights','Permission / licence reference');field('reviewer','Imported by');const permission=field('permission','I have permission to use these captured pages','checkbox');const submit=el('button','Import page pair','primary');submit.type='submit';form.append(submit);form.onsubmit=e=>{e.preventDefault();action(async()=>{submit.disabled=true;try{for(const s of ['left','right'])if(inputs[s+'_html'].files[0].size>1_000_000)throw Error('Each HTML capture must be below 1 MB');const metadata={content_use_permitted:permission.checked,rights_basis:inputs.rights.value,pairing_rationale:inputs.pairing.value,reviewer:inputs.reviewer.value,captured_at_utc:new Date(inputs.captured.value).toISOString()};for(const s of ['left','right'])metadata[s]={url:inputs[s+'_url'].value,language:inputs[s+'_language'].value};await post('pairs',{title:inputs.title.value,left_html:await inputs.left_html.files[0].text(),right_html:await inputs.right_html.files[0].text(),metadata})}finally{submit.disabled=false}})};panel.append(form);root.append(panel)}
function report(c){const lines=['LOST IN SWITZERLAND — CAMPAIGN REPORT',c.name,'Exported: '+new Date().toISOString(),''];for(const p of c.pairs){lines.push(p.title,p.bundle.fixture?'AUTHORED DEMONSTRATION — NOT GOVERNMENT CONTENT OR MODEL RESULTS':'Captured federal content','Analysis: '+p.status,'Bundle: '+p.bundle.digest);for(const s of ['left','right'])lines.push(p.bundle[s].locale+': '+p.bundle[s].source_url,'Source hash: '+p.bundle[s].sha256_extract);for(const f of p.bundle.analysis.candidates){const r=p.review?.reviews.find(r=>r.candidate_id===f.id);lines.push('Possible difference: '+f.left+' / '+f.right,'Review: '+(r?r.state+' · '+r.reviewer+' · '+r.reason:'NOT REVIEWED'))}lines.push('')}lines.push('Human review is self-declared. No suggestions does not prove equivalence.');return lines.join('\n')}
function download(text,type,name){const u=URL.createObjectURL(new Blob([text],{type})),a=el('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('#campaigns').onclick=()=>{active=null;render()};$('#capabilities').onclick=()=>{$('#view').replaceChildren(el('h1','Capabilities'),el('p','Available: durable campaigns, permitted BFE capture imports, one-attempt local comparisons, evidence review, saved review revisions and campaign reports.'),el('div','Not connected: automatic discovery, scheduled monitoring, remote workers, multi-user authentication and outreach.','alert'));active=null};
addEventListener('message',e=>{const frame=$('iframe');if(e.origin!==location.origin||e.source!==frame?.contentWindow||e.data?.type!=='federal-review'||e.data.campaign!==active||e.data.pair!==pair)return;action(async()=>{try{await api('/api/campaigns/'+active+'/review',{pair,draft:e.data.draft});await refresh(false);frame.contentWindow.postMessage({type:'review-result',message:'Review saved to this campaign.'},location.origin)}catch(err){frame.contentWindow.postMessage({type:'review-result',message:err.message},location.origin);throw err}})});
action(()=>refresh());setInterval(()=>{if(campaign()?.pairs.some(p=>p.status==='running'))action(()=>refresh(tab==='Runs'||tab==='Overview'))},2500);
</script></body></html>
